[package]
name = "gpucore"
version = "0.1.0"
edition = "2021"
description = "GPU core of the disaster-swarm simulator: camera, map fusion, alignment, TSDF mesher, radio (CUDA via NVRTC)"

[lib]
name = "gpucore"
crate-type = ["cdylib"]

[dependencies]
cudarc = { version = "0.19.10", default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-13000"] }
numpy = "0.30.0"
pyo3 = { version = "0.30.1", features = ["extension-module", "abi3-py310"] }

[profile.release]
opt-level = 3
lto = true
