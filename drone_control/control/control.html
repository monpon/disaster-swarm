<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drone control</title>
<style>
  :root { --bg: #14171c; --panel: #1b2027; --line: #2b323c; --text: #e7ebf0; --muted: #8b95a3; --ok: #3ddc97; --warn: #f5b942; --bad: #ff5a4d; }
  @media (prefers-color-scheme: light) { :root { --bg: #f2f3f5; --panel: #fff; --line: #d9dde3; --text: #1b2027; --muted: #5f6b7a; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; height: 100vh; display: grid;
         grid-template-columns: minmax(0, 1fr) 340px; gap: 12px; padding: 12px; }
  @media (max-width: 800px) { body { grid-template-columns: minmax(0, 1fr); height: auto; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; min-height: 0; }
  #videoCard { position: relative; overflow: hidden; min-height: 260px; display: flex; align-items: center; justify-content: center; }
  #video { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-90deg); display: block; }
  #noVideo { color: var(--muted); }
  #side { display: flex; flex-direction: column; gap: 12px; overflow: auto; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-weight: 600; background: var(--line); }
  .pill.ok { background: var(--ok); color: #06210f; } .pill.warn { background: var(--warn); color: #2b1d00; } .pill.bad { background: var(--bad); color: #fff; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--text); cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button:disabled { opacity: .4; cursor: default; }
  #emergency { width: 100%; padding: 18px; font-size: 18px; font-weight: 800; background: var(--bad); border-color: var(--bad); color: #fff; letter-spacing: .04em; }
  .stat { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .stat b { color: var(--text); font-weight: 600; }
  .bars { display: grid; grid-template-columns: 70px 1fr 36px; gap: 4px 8px; align-items: center; margin-top: 8px; font-size: 12px; }
  .bar { height: 8px; background: var(--line); border-radius: 4px; position: relative; }
  .bar i { position: absolute; top: 0; bottom: 0; background: var(--ok); border-radius: 4px; }
  .keys { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
  kbd { background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font: 11px monospace; color: var(--text); }
  #log { color: var(--muted); font-size: 12px; margin: 6px 0 0; padding-left: 16px; }
  #msg { min-height: 1.4em; margin-top: 8px; font-size: 12px; color: var(--warn); }
</style>
</head>
<body>
<div class="card" id="videoCard">
  <span id="noVideo">no video (the live page must be running: port 8766)</span>
  <img id="video" alt="drone camera" hidden>
</div>
<div id="side">
  <div class="card">
    <h1>Drone <span id="state" class="pill">connecting</span></h1>
    <div class="stat">link <b id="link">–</b> · relay RC echo <b id="echo">–</b> · flight <b id="flight">0</b> s</div>
    <div class="stat" id="reason"></div>
    <div class="row">
      <button id="arm">Arm</button><button id="disarm">Disarm</button>
      <button id="takeoff">Takeoff</button><button id="land">Land</button>
      <button id="calibrate" title="the drone's gyro calibration; level and still, on the ground">Calibrate</button>
    </div>
    <div id="msg"></div>
  </div>
  <button id="emergency" title="cuts the motors (Space)">EMERGENCY STOP (Space)</button>
  <div class="card">
    <h1>Sticks sent</h1>
    <div class="bars" id="bars"></div>
    <p class="keys"><kbd>W</kbd><kbd>S</kbd> forward / back · <kbd>A</kbd><kbd>D</kbd> left / right · <kbd>R</kbd><kbd>F</kbd> up / down ·
      <kbd>Q</kbd><kbd>E</kbd> turn · <kbd>Space</kbd> emergency stop. Sticks only count while flying; let go and it hovers, stay quiet and it lands.</p>
  </div>
  <div class="card"><h1>Log</h1><ol id="log"></ol></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const token = new URLSearchParams(location.search).get('token') || '';
const headers = { 'Content-Type': 'application/json', 'X-Token': token };

async function post(path, body) {
  try {
    const r = await fetch(path, { method: 'POST', headers, body: body ? JSON.stringify(body) : undefined });
    const j = await r.json().catch(() => ({}));
    if (!r.ok && path !== '/sticks') $('msg').textContent = j.message || ('error ' + r.status);
    else if (path !== '/sticks') $('msg').textContent = '';
    return j;
  } catch (e) { $('msg').textContent = 'controller offline'; return {}; }
}
$('arm').onclick = () => post('/arm');
$('disarm').onclick = () => post('/disarm');
$('takeoff').onclick = () => { if (confirm('Props clear and the area safe? The drone will take off.')) post('/takeoff'); };
$('land').onclick = () => post('/land');
$('calibrate').onclick = () => post('/calibrate');
$('emergency').onclick = () => post('/emergency');

// Keys: held keys set the sticks (-1..1); they are sent at 20 Hz while anything is held, and once more as zeros on release.
const down = new Set();
const MAP = { w: ['pitch', 1], s: ['pitch', -1], d: ['roll', 1], a: ['roll', -1], r: ['throttle', 1], f: ['throttle', -1], e: ['yaw', 1], q: ['yaw', -1] };
function sticks() {
  const s = { roll: 0, pitch: 0, throttle: 0, yaw: 0 };
  for (const k of down) { const [axis, v] = MAP[k]; s[axis] += v; }
  for (const a in s) s[a] = Math.max(-1, Math.min(1, s[a]));
  return s;
}
addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) post('/emergency'); return; }
  const k = e.key.toLowerCase();
  if (k in MAP) { e.preventDefault(); down.add(k); }
});
addEventListener('keyup', (e) => { if (e.code === 'Space') e.preventDefault(); const k = e.key.toLowerCase(); if (k in MAP) { down.delete(k); post('/sticks', sticks()); } });
function release() { if (down.size) { down.clear(); post('/sticks', sticks()); } }
addEventListener('blur', release);
document.addEventListener('visibilitychange', () => { if (document.hidden) release(); });
setInterval(() => { if (down.size) post('/sticks', sticks()); }, 50);

// Status.
const AX = ['roll', 'pitch', 'throttle', 'yaw'];
$('bars').innerHTML = AX.map((a) => `<span>${a}</span><span class="bar"><i id="b-${a}"></i></span><b id="v-${a}">128</b>`).join('');
async function refresh() {
  let s;
  try { s = await (await fetch('/status', { cache: 'no-store' })).json(); }
  catch (e) { $('state').textContent = 'controller offline'; $('state').className = 'pill bad'; return; }
  const st = $('state');
  st.textContent = s.state;
  st.className = 'pill ' + ({ flying: 'ok', armed: 'warn', landing: 'warn', emergency: 'bad' }[s.state] || '');
  $('link').textContent = s.link_ok ? 'ok' : 'NOT confirmed';
  $('echo').textContent = s.relay_rc_age_s == null ? '–' : s.relay_rc_age_s.toFixed(2) + ' s ago';
  $('flight').textContent = s.flight_s;
  $('reason').textContent = s.reason;
  $('arm').disabled = s.state !== 'disarmed';
  $('disarm').disabled = s.state === 'flying';
  $('takeoff').disabled = s.state !== 'armed';
  $('land').disabled = s.state !== 'flying';
  $('calibrate').disabled = !(s.state === 'disarmed' || s.state === 'armed');
  for (const a of AX) {
    const v = s.sent[a], i = $('b-' + a);
    const mid = 128, lo = 50, hi = 200;
    const pos = (v - lo) / (hi - lo) * 100, m = (mid - lo) / (hi - lo) * 100;
    i.style.left = Math.min(pos, m) + '%'; i.style.width = Math.abs(pos - m) + '%';
    $('v-' + a).textContent = v;
  }
  $('log').innerHTML = (s.log || []).map(([ago, what]) => `<li>${ago} s ago: ${what}</li>`).join('');
}
setInterval(refresh, 250); refresh();

// Video from the live page on the same machine (port 8766), turned 90 degrees counter-clockwise like there.
const img = $('video');
function fit() {
  const w = img.naturalWidth, h = img.naturalHeight, c = $('videoCard');
  if (!w || !h) return;
  const s = Math.min(c.clientWidth / h, c.clientHeight / w);
  img.style.width = w * s + 'px'; img.style.height = h * s + 'px';
}
img.onload = () => { img.hidden = false; $('noVideo').hidden = true; fit(); };
img.onerror = () => setTimeout(() => { img.src = `http://${location.hostname}:8766/video.mjpg?` + Date.now(); }, 3000);
img.src = `http://${location.hostname}:8766/video.mjpg?` + Date.now();
addEventListener('resize', fit); setInterval(fit, 1000);
</script>
</body>
</html>
